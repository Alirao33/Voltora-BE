# Local Kubernetes deployment (kind / minikube / Docker Desktop): PostgreSQL + FastAPI backend.
#   kubectl apply -f k8s/voltora.yaml
#   kubectl -n voltora port-forward svc/backend 8000:8000     # API on http://localhost:8000
apiVersion: v1
kind: Namespace
metadata:
  name: voltora
---
apiVersion: v1
kind: Secret
metadata:
  name: voltora-secrets
  namespace: voltora
type: Opaque
stringData:
  # Local-only placeholders. Change them for anything shared.
  POSTGRES_USER: voltora_user
  POSTGRES_PASSWORD: voltora_secure_password
  POSTGRES_DB: voltora_db
  DATABASE_URL: postgresql+psycopg2://voltora_user:voltora_secure_password@postgres:5432/voltora_db
  SECRET_KEY: change-me-local-secret
  DEVICE_API_KEY: change-me-device-key
  PAYMENT_WEBHOOK_SECRET: change-me-webhook-secret
  BOOTSTRAP_ADMIN_PASSWORD: Admin@2026!
---
# Postgres: StatefulSet + PVC so data survives pod restarts.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: voltora
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: voltora
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: voltora-secrets
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# Backend API. Image is built locally: docker build -t voltora-backend:local .
# shortcut: replicas stays 1 because every pod runs init_db + seeding on start and they would race;
# scale up with `kubectl -n voltora scale deploy/backend --replicas=2` once the first pod is Ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: voltora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: backend
          image: voltora-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: voltora-secrets
          env:
            # dev + OTP echo so the admin 2-step login shows its code locally; use ENV=prod elsewhere.
            - name: ENV
              value: dev
            - name: OTP_DEV_ECHO
              value: "true"
            - name: SEED_DEMO_DATA
              value: "true"
            - name: CORS_ORIGINS
              value: "*"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: voltora
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
